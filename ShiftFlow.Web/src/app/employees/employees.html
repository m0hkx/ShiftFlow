<header>
  <h1>Employees</h1>
</header>

@if (loading()) {
  <p>Loading...</p>
} @else if (error()) {
  <p role="alert">{{ error() }}</p>
} @else {
  <ul>
    @for (employee of employees(); track employee.id) {
      <li>{{ employee.name }} - {{ employee.position }}</li>
    } @empty {
      <li>No employees yet.</li>
    }
  </ul>
}
